name: customer_app
description: "Flutter Customer Application for Scan. Pay. Go. Retail Self-Checkout System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  flutter_secure_storage: ^9.2.4
  qr_flutter: ^4.1.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  provider: ^6.1.2
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env

