publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  flutter_secure_storage: ^9.0.0
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  provider: ^6.1.2
